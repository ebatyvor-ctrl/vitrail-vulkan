name: build

on:
  push:
    branches:
      - fabric-1.21.10
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Vitrail Fabric (1.21.10 Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (PojavLauncher Compatibility)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enforce Java 21 Bytecode Target (Class 65.0)
        run: |
          sed -i 's/java_version=.*/java_version=21/g' gradle.properties
          grep "java_version" gradle.properties

      - name: Build Mod with Gradle
        run: ./gradlew assemble -Pjava_version=21 --no-daemon

      - name: Prepare Single Fabric Jar for PojavLauncher (1.21.10)
        run: |
          mkdir -p output
          FABRIC_JAR=$(ls build/libs/*fabric*.jar 2>/dev/null | head -n 1)
          if [ -z "$FABRIC_JAR" ]; then
            FABRIC_JAR=$(ls fabric/build/libs/*.jar 2>/dev/null | head -n 1)
          fi
          if [ -z "$FABRIC_JAR" ]; then
            FABRIC_JAR=$(ls build/libs/*.jar | head -n 1)
          fi

          TARGET="output/vitrail-fabric-1.21.10.jar"
          cp "$FABRIC_JAR" "$TARGET"

          mkdir -p tmp_unpack
          cd tmp_unpack
          jar -xf "../$TARGET"
          if [ -f fabric.mod.json ]; then
            sed -i 's/"minecraft": "[^"]*"/"minecraft": "*"/g' fabric.mod.json
            sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.19.0"/g' fabric.mod.json
            sed -i 's/"sodium": "[^"]*"/"sodium": "*"/g' fabric.mod.json
            sed -i 's/"version": "[^"]*"/"version": "0.13.0+mc1.21.10"/g' fabric.mod.json
            jar -uf "../$TARGET" fabric.mod.json
          fi
          cd ..
          rm -rf tmp_unpack

          echo "=== Готов jar для PojavLauncher (Java 21 / Class 65.0) ==="
          ls -la "$TARGET"

      - name: Upload Single Fabric Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: vitrail-fabric-1.21.10
          path: output/vitrail-fabric-1.21.10.jar
          if-no-files-found: error
          retention-days: 30
