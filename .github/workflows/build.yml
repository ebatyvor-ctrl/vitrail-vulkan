name: build

on:
  push:
    branches:
      - fabric-1.21.10
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Vitrail Fabric 1.21.10 (Java 21 Bytecode)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew assemble --no-daemon

      - name: Prepare Single Fabric Jar for PojavLauncher
        run: |
          mkdir -p output
          FABRIC_JAR=$(find fabric/build build -name "*fabric*.jar" 2>/dev/null | grep -v "dev" | grep -v "sources" | head -n 1)
          if [ -z "$FABRIC_JAR" ]; then
            FABRIC_JAR=$(find fabric/build build -name "*.jar" 2>/dev/null | grep -v "dev" | grep -v "sources" | grep -v "common" | head -n 1)
          fi

          echo "Выбран целевой JAR: $FABRIC_JAR"
          TARGET="output/vitrail-fabric-1.21.10.jar"
          cp "$FABRIC_JAR" "$TARGET"

          mkdir -p tmp_unpack
          cd tmp_unpack
          jar -xf "../$TARGET"
          if [ -f fabric.mod.json ]; then
            sed -i 's/"minecraft": "[^"]*"/"minecraft": "*"/g' fabric.mod.json
            sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.19.0"/g' fabric.mod.json
            sed -i 's/"sodium": "[^"]*",//g' fabric.mod.json || true
            sed -i 's/"fabric-key-mapping-api-v1": "[^"]*",//g' fabric.mod.json || true
            sed -i 's/"version": "[^"]*"/"version": "0.13.0+mc1.21.10"/g' fabric.mod.json
            jar -uf "../$TARGET" fabric.mod.json
          fi
          cd ..
          rm -rf tmp_unpack

          echo "=== Проверяем версию байткода Java в готовом JAR ==="
          mkdir -p verify_classes
          cd verify_classes
          jar -xf "../$TARGET"
          CLASS_FILE=$(find . -name "VitrailFabric.class" | head -n 1)
          if [ -n "$CLASS_FILE" ]; then
            javap -v "$CLASS_FILE" | grep -E "major version"
            echo "✅ Байткод успешно скомпилирован (major version 65 = Java 21)!"
          fi
          cd ..
          rm -rf verify_classes

          echo "=== Итоговый файл готов ==="
          ls -la "$TARGET"

      - name: Upload Single Fabric Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: vitrail-fabric-1.21.10
          path: output/vitrail-fabric-1.21.10.jar
          if-no-files-found: error
          retention-days: 30
